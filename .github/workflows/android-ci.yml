name: Android CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'apk_only'
          - 'bundle_only'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  checks: write

jobs:
  test-and-validate:
    name: 🧪 Test & Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Robolectric Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false --continue

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  build-release:
    name: 📦 Build Release APK & Bundle
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice ::Using production release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV
          else
            echo "::warning ::No RELEASE_KEYSTORE_BASE64 secret found. Generating temporary CI signing keystore."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "ci_build_pass" \
              -keypass "ci_build_pass" \
              -dname "CN=VeriCrypt CI, OU=Build, O=VeriCrypt, L=Cloud, S=Global, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=ci_build_pass" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ci_build_pass" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        if: github.event.inputs.build_type != 'bundle_only'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Build Release App Bundle (AAB)
        if: github.event.inputs.build_type != 'apk_only'
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Organize Artifacts & Generate Checksums
        id: checksums
        run: |
          mkdir -p release-artifacts
          if [ -d "app/build/outputs/apk/release" ]; then
            cp app/build/outputs/apk/release/*.apk release-artifacts/ 2>/dev/null || true
          fi
          if [ -d "app/build/outputs/bundle/release" ]; then
            cp app/build/outputs/bundle/release/*.aab release-artifacts/ 2>/dev/null || true
          fi
          
          cd release-artifacts
          echo "=== SHA-256 and SHA-512 Checksums ===" > checksums.txt
          echo "Generated on: $(date -u)" >> checksums.txt
          echo "" >> checksums.txt
          sha256sum *.* >> checksums.txt 2>/dev/null || true
          echo "" >> checksums.txt
          sha512sum *.* >> checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Upload Release APK & Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vericrypt-release-build
          path: release-artifacts/
          retention-days: 30

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vericrypt-release-build
          path: release-artifacts

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
